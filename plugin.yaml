name: reading
version: "1.0.0"
manifest_version: 2
description: >
  Newsletters out of the Gmail inbox, into a reader built for them. Native Gmail filters move
  the senders you pick into one label, even when Hermes is off. Read them in Hermes Desktop
  (sidebar row Reading) or on your phone, swipe through, unsubscribe in one tap, and ask Hermes about any issue
  (the @newsletter: reference). Setup finds your newsletters for you.
author: Vlad Sergienko
license: MIT
homepage: https://github.com/Nj07r/hermes-reading
requires_hermes: ">=0.23.1"
kind: standalone
tags: [desktop, gmail, newsletters, reading, email, productivity]
provides_tools: []
provides_hooks: []
python_dependencies: []
requires_env:
  - name: READING_GOOGLE_CLIENT_ID
    description: Client ID of your own Google OAuth client (type Desktop app). `hermes reading setup --client FILE` sets it. Press Enter to skip for now.
    url: https://console.cloud.google.com/auth/clients
  - name: READING_GOOGLE_CLIENT_SECRET
    description: Client secret of the same Google client. `hermes reading setup --client FILE` sets it.
    url: https://console.cloud.google.com/auth/clients
    secret: true
oauth:
  - id: google
    authorize_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    scopes:
      - https://www.googleapis.com/auth/gmail.modify
      - https://www.googleapis.com/auth/gmail.settings.basic
    client_id_env: READING_GOOGLE_CLIENT_ID
    client_secret_env: READING_GOOGLE_CLIENT_SECRET
    hosts: [gmail.googleapis.com]
    authorize_params: {access_type: offline, prompt: consent}
config_schema:
  label_name:
    type: str
    default: Reading
    label: Gmail label
    description: The label that holds your newsletters. Reading creates it when it is missing.
  scan_days:
    type: int
    default: 30
    label: Scan days
    description: How far back "Find newsletters" looks in the inbox.
  list_limit:
    type: int
    default: 300
    label: Newsletters in the list
    description: The most recent emails of the label that the reader shows.
  mark_read:
    type: bool
    default: true
    label: Mark as read when opened
